<mat-sidenav-container class="shell-container">
    <mat-sidenav #sidenav class="shell-sidenav" [mode]="isNarrowScreen() ? 'over' : 'side'" [opened]="!isNarrowScreen()" [fixedInViewport]="isNarrowScreen()">
        <div class="brand">
            <mat-icon>local_library</mat-icon>
            <span>Biblioteka</span>
        </div>

        <mat-nav-list>
            <mat-list-item routerLink="/authors"
                routerLinkActive="active-nav-item"
                ariaCurrentWhenActive="page"
                (click)="closeNavigationOnNarrowScreen(sidenav)"
            >
                <mat-icon matListItemIcon>person</mat-icon>
                <span matListItemTitle>Autori</span>
            </mat-list-item>

            <mat-list-item routerLink="/categories"
                routerLinkActive="active-nav-item"
                ariaCurrentWhenActive="page"
                (click)="closeNavigationOnNarrowScreen(sidenav)"
            >
                <mat-icon matListItemIcon>category</mat-icon>
                <span matListItemTitle>Kategorije</span>
            </mat-list-item>

            <mat-list-item routerLink="/books"
                routerLinkActive="active-nav-item"
                ariaCurrentWhenActive="page"
                (click)="closeNavigationOnNarrowScreen(sidenav)"
            >
                <mat-icon matListItemIcon>menu_book</mat-icon>
                <span matListItemTitle>Knjige</span>
            </mat-list-item>

            <mat-list-item routerLink="/members"
                routerLinkActive="active-nav-item"
                ariaCurrentWhenActive="page"
                (click)="closeNavigationOnNarrowScreen(sidenav)"
            >
                <mat-icon matListItemIcon>groups</mat-icon>
                <span matListItemTitle>Članovi</span>
            </mat-list-item>

            <mat-list-item routerLink="/loans"
                routerLinkActive="active-nav-item"
                ariaCurrentWhenActive="page"
                (click)="closeNavigationOnNarrowScreen(sidenav)"
            >
                <mat-icon matListItemIcon>assignment</mat-icon>
                <span matListItemTitle>Zaduženja</span>
            </mat-list-item>
        </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content>
        <mat-toolbar color="primary">
            <button mat-icon-button type="button" aria-label="Otvori ili zatvori navigaciju" matTooltip="Navigacija" (click)="sidenav.toggle()">
                <mat-icon>menu</mat-icon>
            </button>

            <span class="toolbar-title">Bibliotečki informacioni sistem</span>

            <span class="toolbar-spacer"></span>

            <button mat-button type="button" aria-label="Odjavi se"
            matTooltip="Odjavi se" (click)="logout()">
                <mat-icon>logout</mat-icon>
                Odjavi se
            </button>
        </mat-toolbar>

        <main class="shell-main">
            <router-outlet></router-outlet>
        </main>
    </mat-sidenav-content>
</mat-sidenav-container>
